<style>
:root{
  color-scheme:light;
  /* PINO (por defecto): verde pino y coral */
  --papel:#F3F6F2; --tinta:#0F2D28; --suave:#4F6660; --linea:#D2DED8; --logo:#111111;
  --marca:#14604C; --marca-claro:#DCEBE3; --sol:#FF6F59; --sobre-sol:#0F2D28;
  --btn-bg:#14604C; --btn-fg:#FFFFFF;
  --banda-bg:#0F4A3B; --banda-fg:#FFFFFF;
  --error:#B3202F; --ok:#1E7A4F;
}
html[data-modo="oscuro"]{
  color-scheme:dark;
  --papel:#0E1F1C; --tinta:#E8F2EE; --suave:#9DB5AD; --linea:#26403A; --logo:var(--tinta);
  --marca:#5FD0A8; --marca-claro:#17342D;
  --btn-bg:#5FD0A8; --btn-fg:#0E1F1C;
  --banda-bg:#145242; --banda-fg:#FFFFFF;
  --error:#FF8A98; --ok:#6FDC9F;
}

/* CIRUELA: frambuesa y albaricoque */
html[data-tema="ciruela"]{
  --papel:#FAF6F8; --tinta:#2A1233; --suave:#6B5575; --linea:#E5D6E6;
  --marca:#A21E5B; --marca-claro:#F4DDEA; --sol:#FFB84D; --sobre-sol:#2A1233;
  --btn-bg:#A21E5B; --btn-fg:#FFFFFF; --banda-bg:#3E1752; --banda-fg:#FFFFFF;
  --error:#B3202F; --ok:#1E7A4F;
}
html[data-tema="ciruela"][data-modo="oscuro"]{
  --papel:#1A0E20; --tinta:#F6EAF4; --suave:#C0A6C8; --linea:#43274D;
  --marca:#FF8CBD; --marca-claro:#3A1B3F; --btn-bg:#FF8CBD; --btn-fg:#1A0E20;
  --banda-bg:#4B1F63; --banda-fg:#FFFFFF; --error:#FF8A98; --ok:#6FDC9F;
}

/* LADRILLO: teja y ocre */
html[data-tema="ladrillo"]{
  --papel:#F6F3F0; --tinta:#2B1E1A; --suave:#6E5E57; --linea:#E2D8D2;
  --marca:#B23A22; --marca-claro:#F3DDD5; --sol:#E9B949; --sobre-sol:#2B1E1A;
  --btn-bg:#B23A22; --btn-fg:#FFFFFF; --banda-bg:#7C2616; --banda-fg:#FFFFFF;
  --error:#B3202F; --ok:#1E7A4F;
}
html[data-tema="ladrillo"][data-modo="oscuro"]{
  --papel:#1B1412; --tinta:#F5EBE6; --suave:#BBA79E; --linea:#3E2E28;
  --marca:#FF8E73; --marca-claro:#3A221C; --btn-bg:#FF8E73; --btn-fg:#1B1412;
  --banda-bg:#7C2616; --banda-fg:#FFFFFF; --error:#FF8A98; --ok:#6FDC9F;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--papel);color:var(--tinta);font:17px/1.6 "Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;margin:0;letter-spacing:-.02em}
h2{font-size:clamp(2rem,4.6vw,3.2rem);font-weight:800;line-height:1}
h3{font-size:1.3rem;font-weight:700;line-height:1.15}
p{margin:0 0 1em}
a{color:var(--marca)}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--sol);outline-offset:3px}
.contenedor{max-width:1120px;margin:0 auto;padding:0 24px}
.estrecho{max-width:520px}
.suave{color:var(--suave)}
.pagina{padding-top:56px;padding-bottom:88px}
.h-pag{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:800;line-height:.95;margin-bottom:20px}
.intro{font-size:1.15rem;max-width:60ch}

/* Aviso demo */
.demo{background:var(--sol);color:var(--sobre-sol);padding:10px 24px;text-align:center;font-weight:600;font-size:.95rem}

/* Cabecera */
.top{border-bottom:2px solid var(--tinta);background:var(--papel);position:sticky;top:0;z-index:10}
.barra-top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:66px}
.marca{display:flex;align-items:center;gap:12px;font:800 1.3rem/1 "Bricolage Grotesque",sans-serif;color:var(--tinta);text-decoration:none;letter-spacing:-.02em}
.logo{display:block;width:52px;height:52px;flex:none;background-color:var(--logo);-webkit-mask:var(--logo-mini) center/contain no-repeat;mask:var(--logo-mini) center/contain no-repeat}
.logo-banda{display:block;width:170px;height:170px;margin-bottom:28px;background-color:var(--banda-fg);-webkit-mask:var(--logo-full) center/contain no-repeat;mask:var(--logo-full) center/contain no-repeat}
.pie{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pie .logo{width:40px;height:40px}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav a,nav button{padding:.45em .85em;border-radius:999px;color:var(--tinta);text-decoration:none;font:600 .95rem "Instrument Sans",sans-serif;background:none;border:0;cursor:pointer}
nav a:hover,nav button:hover{background:var(--marca-claro)}
nav a[aria-current=page]{background:var(--tinta);color:var(--papel)}
nav .entrar{background:var(--btn-bg);color:var(--btn-fg);margin-left:6px}
.menu-btn{display:none;border:2px solid var(--tinta)!important}
@media(max-width:1000px){
  .menu-btn{display:block}
  nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--papel);border-bottom:2px solid var(--tinta);padding:12px 24px 18px;flex-direction:column;align-items:stretch}
  nav.abierto{display:flex}
  nav a,nav button{text-align:left;padding:.7em .9em}
  nav .entrar{margin:6px 0 0;text-align:center}
}

/* Botones y chips */
.btn{display:inline-block;padding:.7em 1.3em;border:2px solid var(--tinta);border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);font:600 1rem "Instrument Sans",sans-serif;text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--tinta)}
.btn.sec:hover{background:var(--marca-claro)}
.btn.peq{padding:.4em .9em;font-size:.9rem}
.btn.peligro{background:transparent;color:var(--error);border-color:var(--error)}
.chip{display:inline-block;padding:.1em .7em;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--marca-claro);color:var(--tinta);vertical-align:middle}
.chip.pend,.chip.sol{background:var(--sol);color:var(--sobre-sol)}
.chip.no{background:transparent;border:1.5px solid var(--error);color:var(--error)}
.chip.ok{background:transparent;border:1.5px solid var(--ok);color:var(--ok)}
.acciones{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}

/* Hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:center;padding-top:72px;padding-bottom:80px}
.hero h1{font-size:clamp(2.8rem,7.4vw,5.6rem);font-weight:800;line-height:.92;letter-spacing:-.035em;overflow-wrap:anywhere}
.lema{font:700 1.4rem/1.25 "Bricolage Grotesque",sans-serif;color:var(--marca);margin:22px 0 10px}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:48px;padding-top:48px}}

/* Entrada (ticket) */
.ticket{display:block;color:var(--sobre-sol);background:var(--sol);text-decoration:none;transform:rotate(-2deg);
  -webkit-mask:radial-gradient(circle 13px at 0 calc(100% - 92px),transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% calc(100% - 92px),transparent 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 13px at 0 calc(100% - 92px),transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% calc(100% - 92px),transparent 98%,#000) right/51% 100% no-repeat}
.ticket-a{padding:30px 30px 24px}
.t-etq{font-weight:600;margin:0 0 14px}
.t-fecha{font:800 clamp(3.2rem,7vw,5rem)/.88 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;margin:0}
.t-hora{font-weight:600;margin:6px 0 18px}
.ticket h2{font-size:1.7rem;line-height:1.05}
.ticket-b{height:92px;border-top:2px dashed var(--sobre-sol);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 30px;font-weight:600;font-size:.95rem}

/* Secciones */
.seccion{padding-top:72px;padding-bottom:72px}
.seccion-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:32px}

/* Programa */
.fila{display:grid;grid-template-columns:96px 1fr auto;gap:24px;padding:26px 0;border-top:2px solid var(--tinta);align-items:start}
.programa .fila:last-child{border-bottom:2px solid var(--tinta)}
.f-dia{font:800 3.2rem/.88 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em}
.f-mes{font-weight:600;color:var(--suave)}
.fila h3{margin-bottom:6px}
.fila p{margin:0 0 8px;max-width:60ch}
.meta{font-size:.95rem;color:var(--suave);margin:0}
.plazas{margin-top:12px;font-size:.9rem;color:var(--suave);max-width:320px}
.barra{height:6px;background:var(--linea);border-radius:99px;margin-bottom:6px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--marca)}
.f-accion{text-align:right}
@media(max-width:680px){.fila{grid-template-columns:72px 1fr;gap:16px}.f-accion{grid-column:2;text-align:left}.f-dia{font-size:2.6rem}}

/* Proyectos */
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 28px}
.proy img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--marca-claro)}
.ph{display:grid;place-items:center;font:800 5rem "Bricolage Grotesque",sans-serif;color:var(--sobre-sol)}
.ph0{background:var(--sol)}
.ph1{background:var(--marca-claro);color:var(--marca)}
.ph2{background:var(--banda-bg);color:var(--banda-fg)}
.proy-t{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:14px 0 8px}
.proy p{margin:0 0 8px;color:var(--suave)}

/* Banda de redes */
.banda{background:var(--banda-bg);color:var(--banda-fg);padding:80px 0}
.banda a{color:var(--banda-fg)}
.banda-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:56px}
.redes{list-style:none;margin:28px 0 0;padding:0}
.redes a{display:flex;align-items:center;gap:.4em;font:800 clamp(2rem,5vw,3.4rem)/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;text-decoration:none;padding:4px 0;border-bottom:2px solid rgba(255,255,255,.28)}
.redes a:hover{border-color:var(--sol)}
.redes .ico{width:.85em;height:.85em;flex:none}
.contacto p{margin:0 0 .5em}
@media(max-width:820px){.banda-grid{grid-template-columns:1fr;gap:40px}}

footer{padding:28px 0 40px;font-size:.9rem;color:var(--suave)}

/* Formularios */
.formu{display:grid;gap:16px;margin-top:24px}
.campo label{display:block;font-weight:600;font-size:.95rem;margin-bottom:5px}
.campo input,.campo textarea,.campo select{width:100%;padding:.7em .8em;border:2px solid var(--tinta);border-radius:6px;background:var(--papel);color:var(--tinta);font:inherit}
.campo textarea{min-height:110px;resize:vertical}
.campo small{display:block;color:var(--suave);margin-top:4px}
.fila-campos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.fila-campos{grid-template-columns:1fr}}
.pestanas{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 8px}
.pest{padding:.5em 1.1em;border:2px solid var(--tinta);border-radius:999px;background:transparent;color:var(--tinta);font:600 .95rem "Instrument Sans",sans-serif;text-decoration:none;cursor:pointer}
.pest[aria-current=true],.pest[aria-current=page]{background:var(--tinta);color:var(--papel)}
.enlace-btn{background:none;border:0;color:var(--marca);font:inherit;text-decoration:underline;cursor:pointer;padding:0}

/* Avisos y vacíos */
.aviso{background:var(--marca-claro);border-left:6px solid var(--sol);padding:14px 18px;margin:0 0 28px;max-width:70ch}
.error-caja{border:2px solid var(--error);color:var(--error);padding:16px 18px;max-width:70ch}
.vacio{border:2px dashed var(--linea);padding:40px 24px;max-width:60ch}
.vacio h3{margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;display:grid;gap:8px;width:min(92vw,420px)}
.tost{background:var(--tinta);color:var(--papel);padding:12px 18px;border-radius:8px;font-weight:600}
.tost.error{background:var(--error);color:#fff}

/* Encuestas */
.enc{padding:28px 0;border-top:2px solid var(--tinta);max-width:720px}
.opciones{display:grid;gap:10px;margin:18px 0}
.opcion{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--tinta);border-radius:8px;cursor:pointer;font-weight:500}
.opcion:has(input:checked){background:var(--marca-claro);border-color:var(--marca)}
.opcion input{accent-color:var(--marca);width:1.15rem;height:1.15rem}
.res{margin:10px 0}
.res-t{display:flex;justify-content:space-between;gap:12px;font-weight:600;margin-bottom:4px}
.res .barra{height:12px}

/* Admin */
.adm-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:48px;margin-top:28px;align-items:start}
@media(max-width:900px){.adm-grid{grid-template-columns:1fr}}
.lista-adm{list-style:none;margin:16px 0 0;padding:0}
.lista-adm li{padding:16px 0;border-top:1px solid var(--linea);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lista-adm .cuerpo{flex:1 1 260px;min-width:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.apuntados{flex-basis:100%;background:var(--marca-claro);padding:12px 16px;margin-top:4px;font-size:.95rem}
.apuntados ul{margin:6px 0 0;padding-left:1.2em}
.panel-adm h2{margin-bottom:6px}

.lista-adm li[hidden]{display:none}
.lista-adm .apuntados li{border:0;padding:3px 0;display:list-item}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer}
.chk input{accent-color:var(--marca);width:1.1rem;height:1.1rem;flex:none}

/* Noticias */
.noticia{padding:28px 0;border-top:2px solid var(--tinta);max-width:760px}
.n-cab{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.n-texto{white-space:pre-line;max-width:65ch;margin-top:10px}
.noticias-home{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:36px 32px}
.noticia-c{border-top:2px solid var(--tinta);padding-top:16px}
.noticia-c h3{margin-bottom:8px}
.noticia-c p{color:var(--suave)}
.noticia-c .n-cab{color:var(--tinta)}

/* Ficha del socio y fecha de alta */
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 20px;margin:18px 0 6px;padding:18px 0;border-top:2px solid var(--tinta);border-bottom:1px solid var(--linea)}
.ficha dt{font-size:.85rem;font-weight:600;color:var(--suave)}
.ficha dd{margin:2px 0 0;font:700 1.2rem/1.2 "Bricolage Grotesque",sans-serif}
.mini{margin-top:6px}
.mini summary{cursor:pointer;color:var(--marca);font-size:.9rem}
.mini label{display:flex;gap:6px;align-items:center;font-size:.9rem}
.mini form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.mini input{padding:.4em .6em;border:2px solid var(--tinta);border-radius:6px;background:var(--papel);color:var(--tinta);font:inherit}

/* La junta */
.junta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:44px 28px}
.junta-foto,.junta-ini{display:block;width:100%;aspect-ratio:1;border:2px solid var(--tinta)}
.junta-foto{object-fit:cover;background:var(--marca-claro)}
.junta-ini{display:grid;place-items:center;font:800 5rem "Bricolage Grotesque",sans-serif}
.junta-ini.i0{background:var(--sol);color:var(--sobre-sol)}
.junta-ini.i1{background:var(--marca-claro);color:var(--marca)}
.junta-ini.i2{background:var(--banda-bg);color:var(--banda-fg)}
.junta-miembro h3{margin:14px 0 8px}

/* Forma de pago */
.pago{border:0;margin:0;padding:0;display:grid;gap:12px}
.pago legend{font-weight:600;font-size:1rem;padding:0;margin-bottom:6px}
.pago-op .detalle{display:none;padding:12px 4px 0 40px}
.pago-op:has(input[type=radio]:checked) .detalle{display:block}
.pago-op .detalle p{margin:0 0 8px}
.pago-op select,.pago-op input[name=receptor],.pago-op input[name=ibanDom]{width:100%;max-width:360px;padding:.6em .7em;border:2px solid var(--tinta);border-radius:6px;background:var(--papel);color:var(--tinta);font:inherit}

/* Cuota de socio */
.cuota{background:var(--marca-claro);border-left:6px solid var(--sol);padding:16px 20px;margin:20px 0;max-width:62ch}
.cuota p{margin:0 0 8px}
.cuota p:last-child{margin-bottom:0}
.iban{font:800 1.35rem/1.2 "Bricolage Grotesque",sans-serif;letter-spacing:.03em;overflow-wrap:anywhere}

/* Actividades anteriores */
.fila.pasada{grid-template-columns:96px 1fr}
.pasada .a-img{max-height:260px}
/* El cartel va debajo de la fecha, en la columna de la izquierda */
.fila.con-img{grid-template-columns:220px 1fr auto}
.fila.pasada.con-img{grid-template-columns:220px 1fr}
.f-fecha .a-img{width:100%;max-width:100%;height:auto;max-height:none;margin:14px 0 0}
.pasada .f-fecha .a-img{max-height:none}
.programa.hay-img .fila{grid-template-columns:220px 1fr auto}
.programa.hay-img .fila.pasada{grid-template-columns:220px 1fr}
.anio{margin-bottom:28px}
.anio summary{cursor:pointer;font:800 1.7rem/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;padding:10px 0 16px}
@media(max-width:680px){
  .fila.pasada{grid-template-columns:72px 1fr}
  .fila.con-img,.fila.pasada.con-img{grid-template-columns:1fr}
  .fila.con-img .f-accion,.fila.con-img .f-panel{grid-column:1}
  .f-fecha .a-img{max-width:260px}
  .programa.hay-img .fila,.programa.hay-img .fila.pasada{grid-template-columns:72px 1fr}
  .programa.hay-img .fila.con-img,.programa.hay-img .fila.pasada.con-img{grid-template-columns:1fr}
}

/* Carteles de actividades */
.carteles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:44px 32px;align-items:start}
.cartel-marco{position:relative;border:2px solid var(--tinta);background:var(--marca-claro)}
.cartel-img{display:block;width:100%;height:auto}
.cartel-fecha{position:absolute;left:-2px;bottom:18px;background:var(--sol);color:var(--sobre-sol);font:800 1.15rem/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;padding:9px 14px}
.cartel-sin{aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:22px;background:var(--banda-bg);color:var(--banda-fg)}
.cs-dia{font:800 5rem/.85 "Bricolage Grotesque",sans-serif;letter-spacing:-.05em}
.cs-mes{font-weight:600;font-size:1.1rem}
.cartel-cuerpo{padding-top:16px}
.cartel-cuerpo h3{margin-bottom:6px}
.cartel-acc{margin-top:12px}
.cartel-hero{display:block;position:relative;width:fit-content;max-width:100%;margin:0 auto;transform:rotate(-2deg);border:2px solid var(--tinta);box-shadow:10px 10px 0 var(--sol)}
.cartel-hero img{display:block;max-width:100%;max-height:560px;width:auto;height:auto}

/* Imágenes de noticias y actividades */
.n-img{display:block;width:100%;max-height:380px;object-fit:cover;margin:14px 0 6px}
.n-img-c{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;margin-bottom:14px}
.a-img{display:block;width:auto;max-width:100%;max-height:420px;margin:12px 0 4px;border:2px solid var(--tinta)}
.miniatura{display:block;max-width:180px;max-height:120px;object-fit:cover;margin-top:8px;border:1px solid var(--linea)}

.f-panel{grid-column:2/-1;background:var(--marca-claro);padding:18px 20px;margin-top:4px;display:grid;gap:12px}
.f-panel p{margin:0}
.f-panel .btns{align-items:center}

/* Asistentes (familia) */
.asist{text-align:left;min-width:210px}
.asist fieldset{border:0;margin:0 0 10px;padding:0;display:grid;gap:6px}
.asist legend{font-weight:600;font-size:.9rem;padding:0;margin-bottom:6px}

@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>

function antiguedad(iso){
  const [y,m,d] = String(iso).split("-").map(Number), hoy = new Date();
  let meses = (hoy.getFullYear()-y)*12 + (hoy.getMonth()+1-m);
  if(hoy.getDate()<d) meses--;
  if(meses<1) return "menos de un mes";
  const a = Math.floor(meses/12), r = meses%12, partes = [];
  if(a) partes.push(`${a} ${a===1?"año":"años"}`);
  if(r) partes.push(`${r} ${r===1?"mes":"meses"}`);
  return partes.join(" y ");
}

  const [y,m,d] = String(iso).split("-").map(Number), h = new Date();
  let e = h.getFullYear() - y;
  if(h.getMonth()+1 < m || (h.getMonth()+1===m && h.getDate()<d)) e--;

}

const edadAnio = iso => new Date().getFullYear() - Number(String(iso).slice(0,4));

function dniValido(v){
  const t = String(v||"").replace(/[\s-]/g,"").toUpperCase(), L = "TRWAGMYFPDXBNJZSQVHLCKE";
  let m = /^(\d{8})([A-Z])$/.exec(t);
  if(m) return L[Number(m[1])%23]===m[2] ? t : "";
  m = /^([XYZ])(\d{7})([A-Z])$/.exec(t);
  if(m) return L[Number({X:"0",Y:"1",Z:"2"}[m[1]]+m[2])%23]===m[3] ? t : "";
  return "";
}
function ibanValido(v){
  const t = String(v||"").replace(/\s+/g,"").toUpperCase();
  if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(t)) return "";
  const r = t.slice(4)+t.slice(0,4);
  let n = ""; for(const ch of r) n += /[A-Z]/.test(ch) ? String(ch.charCodeAt(0)-55) : ch;
  let resto = 0; for(let i=0;i<n.length;i+=7) resto = Number(String(resto)+n.slice(i,i+7)) % 97;
  return resto===1 ? t : "";
}
function nacimientoPermitido(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v||"") || v>hoyISO()) throw new Error("Escribe tu fecha de nacimiento.");
  const e = edad(v);
  if(e>110) throw new Error("Revisa la fecha de nacimiento.");
  if(e<14) throw new Error("Para darse de alta, los menores de 14 años necesitan la autorización de su padre, madre o tutor. Contacta con la junta.");
  return v;
}

function normMovil(v){
  let d = soloDigitos(v);
  if(d.length===13 && d.startsWith("0034")) d = d.slice(4);

}

}

const listaJunta = () => String(S.ajustes.juntaCobro||"").split("\n").map(x=>x.trim()).filter(Boolean);
function leerPago(fd){
  const forma = fd.get("formaPago");
  if(forma==="efectivo"){
    const r = String(fd.get("receptor")||"").trim();
    if(!r) throw new Error("Indica a qué miembro de la junta le entregas el pago en metálico.");
    return {formaPago:"efectivo", pagadoA:r.slice(0,80)};
  }
  if(forma==="domiciliacion"){
    const iban = ibanValido(fd.get("ibanDom"));
    if(!iban) throw new Error("Escribe un número de cuenta (IBAN) válido para domiciliar la cuota.");
    return {formaPago:"domiciliacion", pagadoA:null, ibanDom:iban};
  }
  return {formaPago:"ingreso", pagadoA:null};
}
function leerDatosPersonales(fd){
  const dni = dniValido(fd.get("dni"));
  if(!dni) throw new Error("Escribe un DNI o NIE válido, con su letra.");
  const residencia = String(fd.get("residencia")||"").trim();
  if(!residencia) throw new Error("Indica tu lugar de residencia.");
  if(fd.get("consentimiento")!=="on") throw new Error("Para darte de alta tienes que aceptar el consentimiento sobre tus datos personales.");
  return {dni, residencia:residencia.slice(0,120)};
}

function cajaCuota(titulo, persona, cierre, renovacion=false){
  if(persona && cuotaNumero(persona.nacimiento)===0) return `<div class="cuota"><p><strong>Cuota gratuita</strong></p><p>No tienes que pagar cuota. La junta aprobará tu alta.</p></div>`;
  const importe = importeCuota(persona?.nacimiento), iban = ibanBonito(S.ajustes.iban);
  const concepto = persona ? `Cuota socio ${persona.nombre} ${persona.apellidos}`.trim() : "Cuota socio y tu nombre y apellidos";
  const efectivo = !renovacion && persona?.formaPago==="efectivo";
  const dom = persona?.formaPago==="domiciliacion";
  const cuerpo = dom
    ? `<p>Has elegido domiciliar la cuota${importe ? ` (${importe})` : ""}. La junta la cobrará en la cuenta que nos indicaste.</p>`
    : efectivo
    ? `<p>Has elegido pagar en metálico${importe ? ` (${importe})` : ""}. Entrégaselo a <strong>${esc(persona.pagadoA||"un miembro de la junta")}</strong>.</p>
       <p class="suave">Si prefieres hacer un ingreso, cambia la forma de pago más abajo.</p>`
    : (iban
        ? `<p>${importe ? `Ingresa <strong>${importe}</strong>` : "Ingresa la cuota anual"} en la cuenta de la asociación:</p>
           <p class="iban">${esc(iban)}</p>
           ${S.ajustes.titularCuenta?`<p class="suave">Titular: ${esc(S.ajustes.titularCuenta)}</p>`:""}
           <p>Escribe como concepto: <strong>${esc(concepto)}</strong></p>
           <p><button type="button" class="btn peq sec" data-accion="copiarIban">Copiar IBAN</button></p>`
        : `<p>La junta te indicará cómo pagar la cuota anual${importe ? ` (${importe})` : ""}.</p>`)
      + (renovacion ? `<p>También puedes pagarla en metálico a un miembro de la junta.</p>` : "");
  return `<div class="cuota"><p><strong>${titulo}</strong></p>${cuerpo}<p class="suave">${cierre}</p></div>`;
}
function avisoCuota(){
  const p = S.perfil; if(!p) return "";
  if(p.estado==="pendiente") return cajaCuota(p.pagoNoRecibido ? "La junta aún no ha recibido tu pago" : "Para completar tu alta", p, "Cuando la junta confirme el pago, activará tu alta y te dará tu número de socio.");
  if(p.estado==="aprobado" && !cuotaAlDia(p)) return cajaCuota(p.cuotaAnio ? `Tienes pendiente de renovar la cuota de ${ANIO}` : `Tienes pendiente de pagar la cuota de ${ANIO}`, p, "Cuando la junta reciba el pago, lo registrará en tu ficha.", true);
  return "";
}

function fichaSocio(p){
  const d = fechaAlta(p);
  let filas;
  if(p.estado==="aprobado"){
    const alDia = cuotaAlDia(p);
    filas = [["Estado","Activo"], ["Número de socio", p.numero ? `nº ${p.numero}` : "Sin asignar"], ["Socio desde", d ? fechaCorta(d) : "Sin fecha"], ["Antigüedad", d ? antiguedad(d) : "Sin fecha"], [`Cuota ${ANIO}`, cuotaGratis(p) ? "Gratuita" : alDia ? "Al día" : (p.cuotaAnio ? "Pendiente de renovar" : "Sin pagar")]];
  } else if(p.estado==="pendiente"){
    filas = [["Estado","Pendiente de aprobación"], ["Solicitud enviada", d ? fechaCorta(d) : "—"], ["Forma de pago", p.formaPago==="efectivo" ? `En metálico, a ${p.pagadoA||"—"}` : (p.formaPago==="domiciliacion" ? "Domiciliación en su cuenta" : "Ingreso o transferencia")], ["Pago", p.pagoNoRecibido ? "La junta aún no lo ha recibido" : "Pendiente de comprobar"]];
  } else {
    filas = [["Estado","Baja o no aprobado"]];
  }
  const c = cuotaNumero(p.nacimiento);
  const nacFilas = p.nacimiento
    ? [["Fecha de nacimiento", `${fechaCorta(p.nacimiento)} (${edad(p.nacimiento)} años)`], ["Categoría", `${categoriaEdad(p.nacimiento)}${c===null ? "" : `, cuota ${c===0 ? "gratuita" : eur(c)}`}`]]
    : [["Fecha de nacimiento", "Sin indicar"]];
  filas.splice(1, 0, ...nacFilas);
  return `<dl class="ficha">${filas.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
}

        ${fichaSocio(p)}
        <form class="formu" data-form="perfil">

/* Cada socio mayor de edad vota una sola vez. Quien gestiona a otros socios elige con cuál vota. */
const esMayorEdad = nac => !!nac && edad(nac) >= 18;
function votantesPosibles(){
  const p = S.perfil;
  const yo = {id:p.id, nombre:`${p.nombre} ${p.apellidos}`.trim()+" (tú)", nacimiento:p.nacimiento};
  if(p.titularId) return [yo];
  return [yo, ...(S.deps||[]).map(f=>({id:f.id, nombre:`${f.nombre} ${f.apellidos}`.trim(), nacimiento:f.nacimiento}))];
}
async function vistaEncuestas(){
  if(!esSocio()) return avisoAcceso("Las encuestas son solo para socios con el alta aprobada.");
  const encs = (await leer("encuestas")).sort(porCreado);
  const personas = votantesPosibles(), adultos = personas.filter(x=>esMayorEdad(x.nacimiento));
  const estado = await Promise.all(encs.map(async e => {
    if(!e.abierta) return null;
    const ya = await Promise.all(adultos.map(async x => (await getDoc(doc(db,"encuestas",e.id,"votos",x.id))).exists()));
    return adultos.map((x,i)=>({...x, voto:ya[i]}));
  }));
  const sinFecha = !esMayorEdad(S.perfil.nacimiento) && !S.perfil.nacimiento;
  return `<section class="contenedor pagina"><h1 class="h-pag">Encuestas</h1>
    <p class="intro" style="margin-bottom:16px">Cada socio mayor de edad vota una sola vez en cada encuesta. Si gestionas a otros socios desde tu cuenta, eliges con cuál de ellos votas. Tu voto es secreto para el resto de socios, y los resultados se publican cuando la junta cierra la encuesta.</p>
    ${sinFecha?`<p class="aviso">Para votar necesitamos tu fecha de nacimiento, porque solo votan los mayores de edad. <a href="#/cuenta">Indícala en Mi portal</a>.</p>`:""}
    ${encs.length?encs.map((e,i)=>encuestaHTML(e,estado[i],personas)).join(""):vacio("No hay encuestas","Cuando la junta lance una, aparecerá aquí.")}</section>`;
}
function encuestaHTML(e, adultos, personas){
  if(!e.abierta) return `<article class="enc"><h3>${esc(e.pregunta)} <span class="chip">Cerrada</span></h3>${resultadosHTML(e.opciones, e.resultados||[], e.totalVotos||0)}</article>`;
  const cab = `<h3>${esc(e.pregunta)}</h3>`;
  if(!adultos.length) return `<article class="enc">${cab}<p class="suave" style="margin-top:10px">No puedes votar en esta encuesta: solo votan los mayores de edad.</p></article>`;
  const pendientes = adultos.filter(a=>!a.voto), ya = adultos.filter(a=>a.voto);
  const yaTxt = ya.length ? `<p class="meta" style="margin-top:10px"><span class="chip ok">Ya ha votado</span> ${ya.map(a=>esc(a.nombre)).join(", ")}</p>` : "";
  const menores = personas.some(x=>!esMayorEdad(x.nacimiento)) ? `<p class="meta">Los menores de edad de tu unidad familiar no votan.</p>` : "";
  if(!pendientes.length) return `<article class="enc">${cab}${yaTxt}${menores}<p class="suave">Ya han votado todas las personas que pueden hacerlo desde tu cuenta. Verás el resultado cuando se cierre.</p></article>`;
  const quien = pendientes.length>1
    ? `<div class="campo"><label for="v-${e.id}">¿Con qué cuenta quieres votar?</label><select id="v-${e.id}" name="votante" required>${pendientes.map(x=>`<option value="${esc(x.id)}">${esc(x.nombre)}</option>`).join("")}</select></div>`
    : `<input type="hidden" name="votante" value="${esc(pendientes[0].id)}"><p class="suave" style="margin-top:10px">Votas como <strong>${esc(pendientes[0].nombre)}</strong>.</p>`;
  return `<article class="enc">${cab}${yaTxt}
    <form data-form="votar" data-id="${e.id}">${quien}<div class="opciones">
      ${e.opciones.map((o,i)=>`<label class="opcion"><input type="radio" name="opcion" value="${i}" required> ${esc(o)}</label>`).join("")}
    </div><button class="btn" type="submit">Votar</button></form>${menores}</article>`;
}
function resultadosHTML(ops, counts, total){
  return `<div style="margin-top:14px">${ops.map((o,i)=>{ const c=counts[i]||0, pc=total?Math.round(c/total*100):0;
    return `<div class="res"><div class="res-t"><span>${esc(o)}</span><span>${c} (${pc}%)</span></div><div class="barra"><i style="width:${pc}%"></i></div></div>`; }).join("")}
    <p class="meta">${total} ${total===1?"voto":"votos"} en total</p></div>`;
}

const chipEstado = u => ({aprobado:'<span class="chip ok">Activo</span>',pendiente:'<span class="chip pend">Pendiente de aprobación</span>',rechazado:'<span class="chip no">Baja o rechazado</span>'}[u.estado]||"");

function campoImagen(ed, etiqueta="Imagen (opcional)"){
  return `<div class="campo"><label for="imagenArchivo">${etiqueta}</label><input id="imagenArchivo" name="imagenArchivo" type="file" accept="image/*"><small>Se reduce automáticamente.${ed.imagen?" Si no eliges otra, se mantiene la actual.":""}</small>${ed.imagen?`<img class="miniatura" src="${esc(ed.imagen)}" alt="Imagen actual">`:""}</div>
    <div class="campo"><label for="imagenUrl">O dirección de una imagen</label><input id="imagenUrl" name="imagenUrl" placeholder="https://..."></div>
    ${ed.imagen?`<label class="chk"><input type="checkbox" name="quitarImagen"> Quitar la imagen actual</label>`:""}`;
}
function admSocios(){
  const todos = S.adm.datos.socios, mapa = Object.fromEntries(todos.map(x=>[x.id,x]));
  const orden = {pendiente:0,aprobado:1,rechazado:2};
  const lista = [...todos].sort((a,b)=>(orden[a.estado]??3)-(orden[b.estado]??3) || (a.numero||1e9)-(b.numero||1e9) || String(a.apellidos).localeCompare(String(b.apellidos)));
  const nombre = x => `${x.nombre||""} ${x.apellidos||""}`.trim();
  const etiq = x => x ? `${x.numero?`nº ${x.numero} `:""}${nombre(x)}` : "socio eliminado";
  const deps = {}; todos.forEach(x=>{ if(x.titularId) (deps[x.titularId] ||= []).push(x); });
  const pendientes = todos.filter(x=>x.estado==="pendiente").length;
  const sinCuota = todos.filter(x=>x.estado==="aprobado" && !cuotaAlDia(x)).length;
  const botones = x => {
    const b = [], yo = x.id===S.user.uid;
    if(yo) b.push(`<span class="chip">Tú</span>`);
    if(x.estado!=="aprobado") b.push(`<button class="btn peq" data-accion="aprobar" data-id="${x.id}">Aprobar (pago recibido)</button>`);
    if(x.estado==="aprobado" && !x.numero) b.push(`<button class="btn peq" data-accion="asignarNumero" data-id="${x.id}">Asignar número</button>`);
    if(x.estado==="aprobado" && !cuotaAlDia(x)) b.push(`<button class="btn peq" data-accion="registrarCuota" data-id="${x.id}">Registrar cuota ${ANIO}</button>`);
    if(x.estado==="aprobado" && cuotaAlDia(x) && !cuotaGratis(x)) b.push(`<button class="btn peq sec" data-accion="noPagada" data-id="${x.id}">Marcar cuota ${ANIO} como no pagada</button>`);
    if(x.estado==="pendiente") b.push(`<button class="btn peq sec" data-accion="pagoNoRecibido" data-id="${x.id}" data-valor="${x.pagoNoRecibido?"0":"1"}">${x.pagoNoRecibido?"Quitar marca de pago no recibido":"Marcar pago no recibido"}</button>`);
    if(x.estado==="pendiente") b.push(`<button class="btn peq peligro" data-accion="estado" data-id="${x.id}" data-valor="rechazado">Rechazar</button>`);
    if(x.estado==="aprobado" && !yo){
      if(x.uid) b.push(`<button class="btn peq sec" data-accion="rol" data-id="${x.id}" data-valor="${x.rol==="admin"?"socio":"admin"}">${x.rol==="admin"?"Quitar administrador":"Hacer administrador"}</button>`);
      b.push(`<button class="btn peq peligro" data-accion="estado" data-id="${x.id}" data-valor="rechazado">Dar de baja</button>`);
    }
    if(x.titularId) b.push(`<button class="btn peq sec" data-accion="desvincular" data-id="${x.id}">Sacar de la unidad familiar</button>`);
    b.push(`<button class="btn peq sec" data-accion="datosPersonales" data-id="${x.id}">${S.adm.privado[x.id]?"Ocultar datos personales":"Datos personales"}</button>`);
    return b.join("");
  };
  const fila = x => `<li data-texto="${esc(`${x.numero||""} ${nombre(x)} ${x.movil||""} ${x.email||""}${x.estado==="aprobado"&&!cuotaAlDia(x)?` cuota pendiente ${x.cuotaAnio?"pendiente de renovar":"sin pagar"}`:""}${x.estado==="pendiente"&&x.pagoNoRecibido?" pago no recibido":""}${x.rol==="admin"?" administrador":""}${x.estado==="pendiente"?" pendiente de aprobación":""}`.toLowerCase())}"><div class="cuerpo"><strong>${x.numero?`Nº ${x.numero}, `:""}${esc(nombre(x))}</strong> ${chipEstado(x)} ${x.estado==="aprobado"?cuotaChip(x):""}${x.estado==="pendiente"&&x.pagoNoRecibido?'<span class="chip no">Pago no recibido</span>':""} ${x.rol==="admin"?'<span class="chip">Administrador</span>':""} ${x.uid?"":'<span class="chip">Sin cuenta</span>'}<br><span class="suave">Móvil ${esc(x.movil||"—")}${x.email?`, ${esc(x.email)}`:""}</span>${nacimientoHTML(x)}${pagoHTML(x)}${socioDesdeHTML(x)}${x.titularId?`<br><span class="suave">En la unidad familiar de ${esc(etiq(mapa[x.titularId]))}</span>`:""}${(deps[x.id]||[]).length?`<br><span class="suave">Unidad familiar: ${deps[x.id].map(d=>esc(etiq(d))).join(", ")}</span>`:""}</div><div class="btns">${botones(x)}</div>${privadoHTML(x)}</li>`;
  return `<div class="panel-adm"><h2>Socios</h2>
    <p class="suave" style="margin-top:8px;max-width:70ch">Los administradores gestionan toda la web. Para dar permisos a un socio, debe tener cuenta y el alta aprobada: pulsa «Hacer administrador» en su ficha. Puedes quitárselos cuando quieras.</p>
    <div class="adm-grid" style="margin-top:12px">
      <form class="formu" data-form="socioJunta"><h3>Añadir socio</h3>
        <div class="fila-campos">
          <div class="campo"><label for="sj-nombre">Nombre</label><input id="sj-nombre" name="nombre" required maxlength="60"></div>
          <div class="campo"><label for="sj-apellidos">Apellidos</label><input id="sj-apellidos" name="apellidos" required maxlength="100"></div>
        </div>
        <div class="campo"><label for="sj-movil">Número de móvil</label><input id="sj-movil" name="movil" type="tel"><small>Obligatorio para mayores de edad. Un menor puede usar el de su padre o madre, o dejarlo en blanco. Recibe su número de socio al guardarlo y no necesita cuenta.</small></div>
        <div class="campo"><label for="sj-nac">Fecha de nacimiento</label><input id="sj-nac" name="nacimiento" type="date" required max="${hoyISO()}"><small>Define la cuota: ${tramosTexto()} (cuenta la edad que cumple este año).</small></div>
        <div class="campo"><label for="sj-dni">DNI o NIE</label><input id="sj-dni" name="dni" maxlength="12" autocomplete="off"><small>Obligatorio a partir de 14 años.</small></div>
        <div class="campo"><label for="sj-res">Lugar de residencia</label><input id="sj-res" name="residencia" required maxlength="120"></div>
        <div class="campo"><label for="sj-iban">Cuenta para domiciliar la cuota (opcional)</label><input id="sj-iban" name="iban" autocomplete="off" placeholder="ES00 0000 0000 0000 0000 0000"></div>
        <label class="chk"><input type="checkbox" name="consentimiento" required> Se ha recogido el consentimiento para la cesión de sus datos (o el de su padre, madre o tutor)</label>
        <div class="campo"><label for="sj-desde">Socio desde</label><input id="sj-desde" name="socioDesde" type="date" required value="${hoyISO()}" max="${hoyISO()}"><small>Si ya era socio de antes, pon la fecha en que se hizo socio.</small></div>
        <label class="chk"><input type="checkbox" name="cuotaPagada" checked> Ha pagado la cuota de ${ANIO}</label>
        <div><button class="btn" type="submit">Añadir socio</button></div></form>
      <form class="formu" data-form="unir"><h3>Unir socios en una unidad familiar</h3>
        <div class="campo"><label for="un-titular">Titular (número de socio o móvil)</label><input id="un-titular" name="titular" required></div>
        <div class="campo"><label for="un-socio">Socio que se une (número de socio o móvil)</label><input id="un-socio" name="socio" required></div>
        <div><button class="btn" type="submit">Unir</button></div></form>
    </div>
    ${pendientes?`<p style="margin-top:28px;max-width:70ch"><strong>${pendientes} ${pendientes===1?"solicitud pendiente":"solicitudes pendientes"} de aprobación.</strong> Salen las primeras de la lista. Apruébalas solo cuando hayas comprobado el ingreso de la cuota.</p>`:""}
    ${sinCuota?`<p class="suave" style="margin-top:28px">${sinCuota} ${sinCuota===1?"socio tiene":"socios tienen"} la cuota de ${ANIO} sin pagar o por renovar. Usa el filtro «Cuota pendiente» para verlos.</p>`:""}
    <div class="campo" style="margin-top:32px;max-width:420px"><label for="buscar-socio">Buscar</label><input id="buscar-socio" type="search" data-filtro="lista-socios" placeholder="Número, nombre o móvil"></div>
    <div class="btns" style="margin-top:14px">
      <button type="button" class="btn peq sec" data-accion="filtrar" data-valor="">Todos</button>
      <button type="button" class="btn peq sec" data-accion="filtrar" data-valor="pendiente de aprobación">Pendientes de aprobación</button>
      <button type="button" class="btn peq sec" data-accion="filtrar" data-valor="pago no recibido">Pago no recibido</button>
      <button type="button" class="btn peq sec" data-accion="filtrar" data-valor="cuota pendiente">Cuota pendiente</button>
    </div>
    ${lista.length?`<ul class="lista-adm" id="lista-socios">${lista.map(fila).join("")}</ul>`:"<p>Todavía no hay socios registrados.</p>"}</div>`;
}
function admActividades(){
  const D = S.adm.datos, ed = D.actividades.find(x=>x.id===S.adm.edit)||{};
  const usuarios = Object.fromEntries(D.socios.map(u=>[u.id,u]));
  const lista = [...D.actividades].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const apuntados = a => {
    const grupos = Object.entries(a.inscritos||{}).filter(([,l])=>l.length);
    const ext = S.adm.externos[a.id]||[];
    if(!grupos.length && !ext.length) return "Nadie se ha apuntado todavía.";
    let nSocios = 0, nNo = ext.length, total = 0, hayPrecio = false;
    const filasSocios = grupos.map(([hid,l])=>{
      const cab = usuarios[hid]||{}, socio = cab.estado==="aprobado";
      const nombres = l.map(id => { const x = usuarios[id]; return x ? `${x.numero?`nº ${x.numero} `:""}${x.nombre||""} ${x.apellidos||""}`.trim() : "Persona eliminada"; });
      const precio = socio ? a.precioSocio : a.precioNoSocio;
      const importe = typeof precio==="number" ? precio*l.length : null;
      if(socio) nSocios += l.length; else nNo += l.length;
      if(importe!==null){ total += importe; hayPrecio = true; }
      const detalle = [cab.movil?`móvil ${esc(cab.movil)}`:"", cab.email?esc(cab.email):"", importe!==null?`a cobrar ${eur(importe)}`:""].filter(Boolean).join(", ");
      const soloTitular = l.length===1 && l[0]===hid;
      return `<li><strong>${nombres.map(esc).join(", ")}</strong> <span class="chip ${socio?"ok":"pend"}">${socio?"Socio":"No socio"}</span>${soloTitular?"":` <span class="suave">(unidad familiar de ${esc(`${cab.nombre||"socio eliminado"} ${cab.apellidos||""}`.trim())})</span>`}<br><span class="suave">${detalle}</span></li>`;
    }).join("");
    const impExt = typeof a.precioNoSocio==="number" ? a.precioNoSocio : null;
    if(impExt!==null && ext.length){ total += impExt*ext.length; hayPrecio = true; }
    const filasExt = ext.map(e=>`<li><strong>${esc(e.nombre)} ${esc(e.apellidos)}</strong> <span class="chip pend">No socio</span><br><span class="suave">${[e.telefono?esc(e.telefono):"sin teléfono", impExt!==null?`a cobrar ${eur(impExt)}`:""].filter(Boolean).join(", ")}</span> <button class="btn peq peligro" data-accion="quitarExterno" data-id="${a.id}" data-eid="${esc(e.id)}">Quitar</button></li>`).join("");
    return `<strong>Apuntados (${ocupacion(a)})</strong> <span class="suave">${nSocios} de socios, ${nNo} no socios${hayPrecio?`, total previsto ${eur(total)}`:""}</span><ul>${filasSocios}${filasExt}</ul>`;
  };
  return `<div class="adm-grid">
    <div id="form-adm"><h2 style="font-size:1.8rem">${ed.id?"Editar actividad":"Nueva actividad"}</h2>
      <form class="formu" data-form="actividad">
        <input type="hidden" name="id" value="${esc(ed.id||"")}">
        <div class="campo"><label for="titulo">Título</label><input id="titulo" name="titulo" required value="${esc(ed.titulo||"")}"></div>
        <div class="campo"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion">${esc(ed.descripcion||"")}</textarea></div>
        <div class="campo"><label for="fecha">Fecha y hora</label><input id="fecha" name="fecha" type="datetime-local" required value="${esc(ed.fecha||"")}"></div>
        <div class="campo"><label for="lugar">Lugar</label><input id="lugar" name="lugar" value="${esc(ed.lugar||"")}"></div>
        <div class="campo"><label for="aforo">Plazas (personas)</label><input id="aforo" name="aforo" type="number" min="0" value="${ed.aforo??0}"><small>Pon 0 si no hay límite. Cada miembro de una familia ocupa una plaza.</small></div>
        <div class="fila-campos">
          <div class="campo"><label for="precioSocio">Precio para socios (€)</label><input id="precioSocio" name="precioSocio" type="number" min="0" step="0.01" value="${ed.precioSocio??""}"></div>
          <div class="campo"><label for="precioNoSocio">Precio para no socios (€)</label><input id="precioNoSocio" name="precioNoSocio" type="number" min="0" step="0.01" value="${ed.precioNoSocio??""}"></div>
        </div>
        <small class="suave" style="margin-top:-6px">Déjalos vacíos si la actividad no tiene precio. Pon 0 si es gratis.</small>
        ${campoImagen(ed,"Cartel de la actividad (opcional)")}
        <div class="acciones" style="margin:0"><button class="btn" type="submit">${ed.id?"Guardar cambios":"Publicar actividad"}</button>${ed.id?`<button type="button" class="btn sec" data-accion="cancelar">Cancelar</button>`:""}</div>
      </form></div>
    <div><h2 style="font-size:1.8rem">Actividades</h2>
      ${lista.length?`<ul class="lista-adm">${lista.map(a=>{ const pasada=new Date(a.fecha)<new Date(), n=ocupacion(a);
        return `<li><div class="cuerpo"><strong>${esc(a.titulo)}</strong> ${pasada?'<span class="chip">Pasada</span>':""}<br><span class="suave">${a.fecha?fechaLarga(new Date(a.fecha)):""}${a.lugar?`, ${esc(a.lugar)}`:""}<br>${n} ${n===1?"persona apuntada":"personas apuntadas"}${a.aforo?` de ${a.aforo} plazas`:""}</span></div>
          <div class="btns"><button class="btn peq sec" data-accion="inscritos" data-id="${a.id}">${S.adm.abierto[a.id]?"Ocultar":"Ver"} apuntados</button><button class="btn peq sec" data-accion="editar" data-id="${a.id}">Editar</button><button class="btn peq peligro" data-accion="borrar" data-id="${a.id}" data-col="actividades">Eliminar</button></div>
          ${S.adm.abierto[a.id]?`<div class="apuntados">${apuntados(a)}</div>`:""}</li>`;}).join("")}</ul>`:"<p>Todavía no has publicado ninguna actividad.</p>"}</div></div>`;
}

function admJunta(){
  const D = S.adm.datos, ed = D.junta.find(x=>x.id===S.adm.edit)||{};
  const lista = [...D.junta].sort((a,b)=>(a.orden??99)-(b.orden??99) || String(a.nombre).localeCompare(String(b.nombre)));
  return `<div class="adm-grid">
    <div id="form-adm"><h2 style="font-size:1.8rem">${ed.id?"Editar miembro":"Nuevo miembro"}</h2>
      <form class="formu" data-form="junta">

/* Cada titular guarda la lista de socios que van (él mismo y/o los socios de su unidad familiar) */
async function guardarAsistentes(id, lista){
  const ref = doc(db,"actividades",id), uid = S.user.uid;
  await runTransaction(db, async tx => {
    const snap = await tx.get(ref);
    if(!snap.exists()) throw new Error("La actividad ya no existe.");
    const a = snap.data();
    const antes = (a.inscritos?.[uid]||[]).length, despues = lista.length;
    const ocupadas = (a.ocupadas||0) + despues - antes;
    if(a.aforo>0 && despues>antes && ocupadas+(a.ocupadasExternos||0)>a.aforo) throw new Error("No quedan plazas suficientes para todos.");
    tx.update(ref,{["inscritos."+uid]:lista, ocupadas});
  });
}
/* Alta de un no socio: no necesita cuenta. Se guarda aparte (solo la junta la ve)
   y se suma una plaza en el contador público de la actividad. */
async function registrarExterno(id, d){
  const ref = doc(db,"actividades",id);
  const nuevo = doc(collection(db,"actividades",id,"externos"));
  await runTransaction(db, async tx => {
    const snap = await tx.get(ref);
    if(!snap.exists()) throw new Error("La actividad ya no existe.");
    const a = snap.data();
    if(a.aforo>0 && ocupacion(a)+1>a.aforo) throw new Error("Esta actividad está completa.");
    tx.set(nuevo,{nombre:d.nombre, apellidos:d.apellidos, telefono:d.telefono, creado:serverTimestamp()});
    tx.update(ref,{ocupadasExternos:(a.ocupadasExternos||0)+1, ultimoExterno:nuevo.id});
  });
}
async function cargarExternos(id){
  const sn = await getDocs(collection(db,"actividades",id,"externos"));
  S.adm.externos[id] = sn.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.creado?.toMillis?.()||0)-(y.creado?.toMillis?.()||0));
}
/* Número de socio: lo asigna la junta de forma correlativa y única. También guarda un índice
   (número y móvil -> socio) para poder unir socios sin exponer la lista de socios. */
async function aprobarSocio(id, conCuota=true){
  const ref = doc(db,"socios",id), cont = doc(db,"config","contador");
  await runTransaction(db, async tx => {
    const sn = await tx.get(ref), c = await tx.get(cont);
    if(!sn.exists()) throw new Error("Ese socio ya no existe.");
    const socio = sn.data();
    const desde = socio.socioDesde ? {} : {socioDesde:hoyISO()};
    if(socio.numero){ tx.update(ref,{estado:"aprobado", pagoNoRecibido:false, ...desde, ...(conCuota?{cuotaAnio:ANIO}:{})}); return; }
    const menor = !!socio.nacimiento && edad(socio.nacimiento) < 18;
    const mref = socio.movil ? doc(db,"indice","m"+socio.movil) : null, m = mref ? await tx.get(mref) : null;
    const ocupado = !!m && m.exists() && m.data().socioId!==id;
    if(ocupado && !menor) throw new Error("Ese móvil ya pertenece a otro socio.");
    const numero = (c.exists() ? (c.data().ultimo||0) : 0) + 1;
    tx.update(ref,{estado:"aprobado", pagoNoRecibido:false, numero, ...desde, ...(conCuota?{cuotaAnio:ANIO}:{})});
    tx.set(doc(db,"indice","n"+numero),{socioId:id});
    if(mref && !ocupado) tx.set(mref,{socioId:id});
    tx.set(cont,{ultimo:numero});
  });
}
async function crearSocioJunta(d){
  const ref = doc(collection(db,"socios")), cont = doc(db,"config","contador"), mref = d.movil ? doc(db,"indice","m"+d.movil) : null;
  const menor = edad(d.nacimiento) < 18;
  await runTransaction(db, async tx => {
    const c = await tx.get(cont), m = mref ? await tx.get(mref) : null;
    const ocupado = !!m && m.exists();
    if(ocupado && !menor) throw new Error("Ese móvil ya pertenece a otro socio.");
    const numero = (c.exists() ? (c.data().ultimo||0) : 0) + 1;
    tx.set(ref,{nombre:d.nombre, apellidos:d.apellidos, movil:d.movil||"", nacimiento:d.nacimiento, uid:null, rol:"socio", estado:"aprobado", titularId:null, numero, consentimiento:true, ...(d.ibanDom?{formaPago:"domiciliacion"}:{}), cuotaAnio:d.cuotaAnio ?? null, socioDesde:d.socioDesde, creado:serverTimestamp()});
    tx.set(doc(db,"socios",ref.id,"privado","datos"),{...(d.dni?{dni:d.dni}:{}), residencia:d.residencia, ...(d.ibanDom?{ibanDomiciliacion:d.ibanDom}:{})});
    tx.set(doc(db,"indice","n"+numero),{socioId:ref.id});
    if(mref && !ocupado) tx.set(mref,{socioId:ref.id});
    tx.set(cont,{ultimo:numero});
  });
}
async function resolverSocio(dato){
  const clave = claveSocio(dato);
  if(!clave) throw new Error("Escribe un número de socio o un móvil válido.");
  const ix = await getDoc(doc(db,"indice",clave));
  if(!ix.exists()) throw new Error("No hemos encontrado ningún socio con ese dato.");
  return ix.data().socioId;
}

async function contarVotos(id){
  const e = S.adm.datos.encuestas.find(x=>x.id===id);
  const counts = e.opciones.map(()=>0);
  (await getDocs(collection(db,"encuestas",id,"votos"))).docs.forEach(d=>{ const i=d.data().opcion; if(counts[i]!==undefined) counts[i]++; });
  return {counts, total:counts.reduce((a,b)=>a+b,0)};
}

function archivoADataURL(file, max=900, q=.78){
  return new Promise((ok,ko)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); let o=c.toDataURL("image/jpeg",q); if(o.length>600000) o=c.toDataURL("image/jpeg",.5); ok(o); };
    img.onerror=()=>ko(new Error("No se ha podido leer la imagen."));
    img.src=url;
  });
}
const precio = v => { const n = parseFloat(String(v).replace(",",".")); return Number.isFinite(n) && n>=0 ? n : null; };
async function imagenDeFormulario(fd, previo, max=900){
  if(fd.get("quitarImagen")==="on") return "";
  const file = fd.get("imagenArchivo");
  if(file && file.size) return await archivoADataURL(file, max);
  const url = safeUrl(fd.get("imagenUrl")||"");
  return url || previo || "";
}

  async actividad(f,fd){
    const id = fd.get("id");
    const datos = {titulo:fd.get("titulo").trim(), descripcion:fd.get("descripcion").trim(), fecha:fd.get("fecha"), lugar:fd.get("lugar").trim(), aforo:Math.max(0,parseInt(fd.get("aforo"))||0), precioSocio:precio(fd.get("precioSocio")), precioNoSocio:precio(fd.get("precioNoSocio")), imagen:await imagenDeFormulario(fd, S.adm.datos.actividades.find(x=>x.id===id)?.imagen, 1200)};
    if(id) await updateDoc(doc(db,"actividades",id),datos);
    else await addDoc(collection(db,"actividades"),{...datos, inscritos:{}, ocupadas:0, ocupadasExternos:0, creado:serverTimestamp()});
    S.adm.edit=null; toast(id?"Cambios guardados":"Actividad publicada"); refrescar();
  },
  async proyecto(f,fd){
    const id = fd.get("id"), previo = S.adm.datos.proyectos.find(x=>x.id===id);
    const imagen = await imagenDeFormulario(fd, previo?.imagen);
    const datos = {titulo:fd.get("titulo").trim(), fecha:fd.get("fecha").trim(), descripcion:fd.get("descripcion").trim(), enlace:fd.get("enlace").trim(), imagen};
    if(id) await updateDoc(doc(db,"proyectos",id),datos);
    else await addDoc(collection(db,"proyectos"),{...datos, creado:serverTimestamp()});
    S.adm.edit=null; toast(id?"Cambios guardados":"Proyecto publicado"); refrescar();
  },
  async ficha(f,fd){
    const nombre = fd.get("nombre").trim(), apellidos = fd.get("apellidos").trim(), movil = normMovil(fd.get("movil"));
    if(!nombre || !apellidos) return toast("Escribe tu nombre y apellidos","error");
    if(!movil) return toast("Escribe un número de móvil válido, de 9 cifras","error");
    const nac = nacimientoPermitido(fd.get("nacimiento")), pers = leerDatosPersonales(fd), {ibanDom, ...pago} = leerPago(fd);
    const lote = writeBatch(db);
    lote.set(doc(db,"socios",S.user.uid),{nombre, apellidos, movil, email:S.user.email, uid:S.user.uid, rol:"socio", estado:"pendiente", titularId:null, nacimiento:nac, consentimiento:true, ...pago, creado:serverTimestamp()});
    lote.set(doc(db,"socios",S.user.uid,"privado","datos"),{...pers, ...(ibanDom?{ibanDomiciliacion:ibanDom}:{})});
    await lote.commit(); S.priv = await cargarPrivado();
    S.perfil = await cargarPerfil(S.user); toast("Solicitud enviada. La junta la revisará pronto.");
    location.hash = "#/cuenta"; await ruta();
  },
  async pago(f,fd){
    const {ibanDom, ...principal} = leerPago(fd);
    await updateDoc(doc(db,"socios",S.user.uid), principal);
    await setDoc(doc(db,"socios",S.user.uid,"privado","datos"), {ibanDomiciliacion: ibanDom ?? null}, {merge:true});
    S.perfil = await cargarPerfil(S.user); S.priv = await cargarPrivado(); toast("Forma de pago guardada"); refrescar();
  },
  async junta(f,fd){
    const id = fd.get("id"), previo = S.adm.datos.junta.find(x=>x.id===id);
    const datos = {cargo:fd.get("cargo").trim(), nombre:fd.get("nombre").trim(), orden:Math.max(1,parseInt(fd.get("orden"))||1), imagen:await imagenDeFormulario(fd, previo?.imagen, 600)};
    if(id) await updateDoc(doc(db,"junta",id),datos);
    else await addDoc(collection(db,"junta"),{...datos, creado:serverTimestamp()});
    S.adm.edit = null; toast(id?"Cambios guardados":"Miembro añadido a la junta"); refrescar();
  },
  async privadoAdmin(f,fd){
    const id = f.dataset.id, datos = {};
    const dniTxt = String(fd.get("dni")||"").trim(), ibanTxt = String(fd.get("iban")||"").trim(), res = String(fd.get("residencia")||"").trim();
    if(dniTxt){ const d = dniValido(dniTxt); if(!d) return toast("El DNI o NIE no es válido","error"); datos.dni = d; }
    if(ibanTxt){ const i = ibanValido(ibanTxt); if(!i) return toast("El IBAN no es válido","error"); datos.ibanDomiciliacion = i; }
    if(res) datos.residencia = res.slice(0,120);
    if(!Object.keys(datos).length) return toast("No hay nada que guardar","error");
    await setDoc(doc(db,"socios",id,"privado","datos"), datos, {merge:true});
    const sn = await getDoc(doc(db,"socios",id,"privado","datos")); S.adm.privado[id] = sn.data(); toast("Datos guardados"); refrescar();
  },
  async nacimiento(f,fd){
    const v = fd.get("fecha");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v||"") || v>hoyISO() || edad(v)>110) return toast("Escribe una fecha de nacimiento válida","error");
    await updateDoc(doc(db,"socios",f.dataset.id),{nacimiento:v}); toast("Fecha de nacimiento guardada"); refrescar();
  },
  async fechaAlta(f,fd){
    const v = fd.get("fecha");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v||"") || v>hoyISO()) return toast("Escribe una fecha válida, que no sea futura","error");
    await updateDoc(doc(db,"socios",f.dataset.id),{socioDesde:v}); toast("Fecha de alta guardada"); refrescar();
  },
  async vincular(f,fd){
    const bid = await resolverSocio(fd.get("dato"));
    if(bid===S.user.uid) throw new Error("Ese eres tú.");
    try{ await updateDoc(doc(db,"socios",bid),{titularId:S.user.uid}); }
    catch(e){
      if(e.code==="permission-denied") throw new Error("No se ha podido añadir. Puede que ese socio ya esté en otra unidad familiar, que no tenga el alta aprobada o que tenga a otros socios a su cargo.");
      throw e;
    }
    await sincronizarDeps(); toast("Socio añadido a tu unidad familiar"); refrescar();
  },
  async socioJunta(f,fd){
    const d = {nombre:fd.get("nombre").trim(), apellidos:fd.get("apellidos").trim(), movil:normMovil(fd.get("movil")), cuotaAnio:fd.get("cuotaPagada")==="on" ? ANIO : null, socioDesde:fd.get("socioDesde"), nacimiento:fd.get("nacimiento"), residencia:String(fd.get("residencia")||"").trim().slice(0,120)};
    if(!d.nombre || !d.apellidos) return toast("Escribe nombre y apellidos","error");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d.nacimiento||"") || d.nacimiento>hoyISO()) return toast("Escribe una fecha de nacimiento válida","error");
    if(String(fd.get("movil")||"").trim() && !d.movil) return toast("El móvil no es válido: escribe 9 cifras","error");
    if(!d.movil && edad(d.nacimiento)>=18) return toast("El móvil es obligatorio para mayores de edad","error");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d.socioDesde||"") || d.socioDesde>hoyISO()) return toast("Escribe una fecha de alta válida, que no sea futura","error");
    const dniTxt = String(fd.get("dni")||"").trim(), ibanTxt = String(fd.get("iban")||"").trim();
    if(dniTxt){ d.dni = dniValido(dniTxt); if(!d.dni) return toast("El DNI o NIE no es válido","error"); }
    else if(edad(d.nacimiento)>=14) return toast("El DNI o NIE es obligatorio a partir de 14 años","error");
    if(!d.residencia) return toast("Indica el lugar de residencia","error");
    if(ibanTxt){ d.ibanDom = ibanValido(ibanTxt); if(!d.ibanDom) return toast("El IBAN para domiciliar no es válido","error"); }
    if(fd.get("consentimiento")!=="on") return toast("Marca que se ha recogido el consentimiento","error");
    await crearSocioJunta(d); toast("Socio añadido"); refrescar();
  },
  async unir(f,fd){
    const a = await resolverSocio(fd.get("titular")), b = await resolverSocio(fd.get("socio"));
    if(a===b) throw new Error("Son el mismo socio.");
    const D = S.adm.datos.socios;
    if(D.find(x=>x.id===a)?.titularId) throw new Error("El titular elegido ya está en la unidad familiar de otro socio.");
    if(D.some(x=>x.titularId===b)) throw new Error("El socio que se une ya tiene socios a su cargo.");
    await updateDoc(doc(db,"socios",b),{titularId:a});
    await recontarDeps(a); toast("Socios unidos"); refrescar();
  },
  async externo(f,fd){
    const d = {nombre:fd.get("nombre").trim(), apellidos:fd.get("apellidos").trim(), telefono:fd.get("telefono").trim()};
    if(!d.nombre || !d.apellidos) return toast("Escribe tu nombre y apellidos","error");
    if(S.demo) return toast("Modo demostración: conecta Firebase para guardar las inscripciones","error");
    await registrarExterno(f.dataset.id, d);
    S.apuntar = {id:f.dataset.id, paso:"hecho", nombre:d.nombre}; refrescar();
  },
  async asistentes(f,fd){
    await guardarAsistentes(f.dataset.id, fd.getAll("p"));
    toast("Asistentes guardados"); refrescar();
  },
  async noticia(f,fd){
    const id = fd.get("id");
    const datos = {titulo:fd.get("titulo").trim(), categoria:fd.get("categoria"), texto:fd.get("texto").trim(), enlace:fd.get("enlace").trim(), fijada:fd.get("fijada")==="on", imagen:await imagenDeFormulario(fd, S.adm.datos.noticias.find(x=>x.id===id)?.imagen)};
    if(id) await updateDoc(doc(db,"noticias",id),datos);
    else await addDoc(collection(db,"noticias"),{...datos, creado:serverTimestamp()});
    S.adm.edit=null; toast(id?"Cambios guardados":"Noticia publicada"); refrescar();
  },
  async encuesta(f,fd){
    const opciones = fd.get("opciones").split("\n").map(s=>s.trim()).filter(Boolean);
    if(opciones.length<2) return toast("Escribe al menos dos opciones","error");
    await addDoc(collection(db,"encuestas"),{pregunta:fd.get("pregunta").trim(), opciones, abierta:true, creado:serverTimestamp()});
    toast("Encuesta lanzada"); refrescar();
  },
  async ajustes(f,fd){
    const redes = {}; REDES.forEach(([k])=>redes[k]=fd.get("red-"+k).trim());
    const datos = {nombre:fd.get("nombre").trim(), lema:fd.get("lema").trim(), descripcion:fd.get("descripcion").trim(), email:fd.get("email").trim(), telefono:fd.get("telefono").trim(), whatsappContacto:fd.get("whatsappContacto").trim(), direccion:fd.get("direccion").trim(), cuotaAdulto:fd.get("cuotaAdulto").trim(), cuotaJoven:fd.get("cuotaJoven").trim(), cuotaInfantil:fd.get("cuotaInfantil").trim(), iban:fd.get("iban").trim(), titularCuenta:fd.get("titularCuenta").trim(), juntaCobro:fd.get("juntaCobro").trim(), juntaMandato:fd.get("juntaMandato").trim(), redes};
    await setDoc(doc(db,"config","web"),datos);
    S.ajustes = {...AJUSTES_POR_DEFECTO, ...datos}; toast("Cambios guardados"); refrescar();
  }
};

document.addEventListener("click", async e=>{
  const el = e.target.closest("[data-accion]"); if(!el) return;
  try{ await ACCIONES[el.dataset.accion]?.(el.dataset.id, el); }
  catch(err){ console.error(err); toast(errMsg(err),"error"); }
});
document.addEventListener("input", e=>{
  const c = e.target.closest('[data-calc="cuota"]');
  if(c){
    const out = $("#cuota-aplicable");
    if(out){ const n = c.value ? cuotaNumero(c.value) : null; out.textContent = n===null ? "" : (n===0 ? "Tu cuota es gratuita." : `Tu cuota anual: ${eur(n)}.`); }
    return;
  }
  const i = e.target.closest("[data-filtro]"); if(!i) return;
  const q = i.value.trim().toLowerCase();
  document.querySelectorAll("#"+i.dataset.filtro+" li").forEach(li => { li.hidden = !!q && !(li.dataset.texto||"").includes(q); });
});
document.addEventListener("submit", async e=>{
  const f = e.target.closest("form[data-form]"); if(!f) return;
  e.preventDefault();
  const btn = f.querySelector("button[type=submit]"); if(btn) btn.disabled = true;
  try{ await FORMS[f.dataset.form]?.(f, new FormData(f)); }
  catch(err){ console.error(err); toast(errMsg(err),"error"); }
  finally{ if(btn) btn.disabled = false; }
});

/* ============================================================
   Rutas
   ============================================================ */
async function ruta(){
  const tk = ++S.tk;
  const [r, query] = (location.hash.replace(/^#\/?/,"")||"inicio").split("?");
  const key = r || "inicio";
  if(key==="entrar" && S.user && S.perfil){ location.hash = "#/actividades"; return; }
  document.title = S.ajustes.nombre;
  let html;
  try{
    html = await ({inicio:vistaInicio, proyectos:vistaProyectos, noticias:vistaNoticias, junta:vistaJunta, actividades:vistaActividades, encuestas:vistaEncuestas, cuenta:vistaCuenta, admin:vistaAdmin, entrar:()=>vistaEntrar(query==="registro"?"registro":"entrar")}[key] || vistaInicio)();
  }catch(err){
    console.error(err);
    html = `<section class="contenedor pagina"><div class="error-caja"><strong>No se han podido cargar los datos.</strong><br>${esc(errMsg(err))}<br>Revisa que las reglas de Firestore estén publicadas y que tu cuenta tenga permiso.</div></section>`;
  }
  if(tk !== S.tk) return;
  const y = window.scrollY, mismo = S.rutaPrev === key;
  $("#app").innerHTML = shell(html, key);
  S.rutaPrev = key;
  window.scrollTo(0, mismo ? y : 0);
}
window.addEventListener("hashchange", () => { S.apuntar = null; ruta(); });

/* ============================================================
   Arranque
   ============================================================ */
(async function init(){
  try{ await cargarAjustes(); }catch(e){ console.error(e); }
  if(S.demo){ await ruta(); return; }
  onAuthStateChanged(auth, async u=>{
    if(S.registrando) return;
    S.user = u; S.perfil = null;
    S.deps = []; S.priv = null;
    try{ if(u){ S.perfil = await cargarPerfil(u); S.priv = await cargarPrivado(); await sincronizarDeps(); } }catch(e){ console.error(e); toast(errMsg(e),"error"); }
    await ruta();
  });
})();
</script>
